<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Video Detay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    if (!localStorage.getItem('token')) {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body class="bg-light">
  <div class="container my-5">
    <h1 class="text-center mb-2" id="video-title">Video Başlığı</h1>
    <p class="text-center mb-4">
      <a id="video-uploader" href="#" class="text-decoration-none text-primary"></a>
    </p>
    <p id="video-description" class="text-center text-muted mb-4"></p>
    <div class="d-flex justify-content-center">
      <video id="video-player" width="720" height="400" controls class="border border-secondary rounded shadow"></video>
    </div>
    <div class="text-center mt-3">
      <button id="like-btn" class="btn btn-outline-danger">
        ❤️ Beğen
      </button>
      <div class="mt-1"><small><span id="like-count">0</span> beğeni</small></div>
      <div><small><span id="view-count">0</span> görüntülenme</small></div>
    </div>

    <div class="mt-5">
      <h3>Yorumlar</h3>
      <ul id="comment-list" class="list-group mb-3"></ul>
      <form id="comment-form">
        <div class="mb-3">
          <label for="comment-input" class="form-label">Yorumunuz</label>
          <textarea class="form-control" id="comment-input" rows="2" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Yorum Ekle</button>
      </form>
    </div>
    
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const token = localStorage.getItem('token');

    if (!id) {
      alert('Video ID bulunamadı');
      window.location.href = 'index.html';
    }

    async function loadVideo() {
      const res = await fetch('/api/videos', {
        headers: { Authorization: 'Bearer ' + token }
      });
      const videos = await res.json();
      const video = videos.find(v => v.id == id);
      if (!video) {
        alert('Video bulunamadı');
        window.location.href = 'index.html';
        return;
      }

      document.getElementById('video-title').textContent = video.originalname;
      document.getElementById('video-description').textContent = video.description || '';
      const uploaderLink = document.getElementById('video-uploader');
      uploaderLink.textContent = '@' + (video.username || 'kullanici');
      uploaderLink.href = 'profile.html?id=' + video.uploaded_by;
      document.getElementById('video-player').src = '/api/stream/' + video.filename;
      document.getElementById('video-player').poster = '/thumbnails/' + (video.thumbnail_path || (video.filename + '.jpg'));
      await loadComments();
      await fetch(`/api/videos/${id}/view`, {
        method: 'POST'
      });
      await loadLikes();
      const viewRes = await fetch(`/api/videos/${id}/views`);
      if (viewRes.ok) {
        const viewData = await viewRes.json();
        document.getElementById('view-count').textContent = viewData.views;
      }
    }

    async function loadComments() {
      const res = await fetch(`/api/videos/${id}/comments`, {
        headers: { Authorization: 'Bearer ' + token }
      });
      const comments = await res.json();
      const list = document.getElementById('comment-list');
      list.innerHTML = '';

      const commentMap = {};
      comments.forEach(c => {
        commentMap[c.id] = { ...c, replies: [] };
      });

      comments.forEach(c => {
        if (c.parent_comment_id) {
          commentMap[c.parent_comment_id]?.replies.push(commentMap[c.id]);
        }
      });

      const renderComment = (comment, isReply = false) => {
        const li = document.createElement('li');
        li.className = 'list-group-item';
        if (isReply) li.classList.add('ms-4', 'bg-light');

        li.innerHTML = `
          <div class="d-flex justify-content-between align-items-center">
            <span>${comment.yorum} <small class="text-muted">(${new Date(comment.tarih).toLocaleString()})</small></span>
            <div>
              <button class="btn btn-sm btn-outline-secondary me-2 reply-btn">Yanıtla</button>
              ${comment.sahibi ? '<button class="btn btn-sm btn-danger">Sil</button>' : ''}
            </div>
          </div>
          <div class="reply-form mt-2 d-none">
            <textarea class="form-control mb-2 reply-text" rows="2" placeholder="Yanıtınız..."></textarea>
            <button class="btn btn-primary btn-sm send-reply">Gönder</button>
          </div>
        `;

        if (comment.sahibi) {
          li.querySelector('.btn-danger').addEventListener('click', async () => {
            if (!confirm('Yorumu silmek istediğinize emin misiniz?')) return;
            const res = await fetch(`/api/videos/${id}/comments/${comment.id}`, {
              method: 'DELETE',
              headers: { Authorization: 'Bearer ' + token }
            });
            if (res.ok) loadComments();
            else alert('Yorum silinemedi');
          });
        }

        li.querySelector('.reply-btn').addEventListener('click', () => {
          li.querySelector('.reply-form').classList.toggle('d-none');
        });

        li.querySelector('.send-reply').addEventListener('click', async () => {
          const replyText = li.querySelector('.reply-text').value;
          if (!replyText.trim()) return;
          const res = await fetch(`/api/videos/${id}/comments`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + token
            },
            body: JSON.stringify({ yorum: replyText, parent_comment_id: comment.id })
          });
          if (res.ok) loadComments();
          else alert('Yanıt gönderilemedi');
        });

        list.appendChild(li);
        (comment.replies || []).forEach(reply => {
          renderComment(reply, true);
        });
        return li;
      };

      comments.forEach(c => {
        if (!c.parent_comment_id) renderComment(commentMap[c.id]);
      });
    }

    async function loadLikes() {
      const res = await fetch(`/api/videos/${id}/likes`, {
        headers: { Authorization: 'Bearer ' + token }
      });
      const data = await res.json();
      document.getElementById('like-count').textContent = data.totalLikes;
      document.getElementById('like-btn').classList.toggle('btn-danger', data.likedByUser);
      document.getElementById('like-btn').classList.toggle('btn-outline-danger', !data.likedByUser);
    }

    document.getElementById('like-btn').addEventListener('click', async () => {
      const res = await fetch(`/api/videos/${id}/like`, {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token }
      });
      if (res.ok) loadLikes();
    });

    document.getElementById('comment-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const yorum = document.getElementById('comment-input').value;
      const res = await fetch(`/api/videos/${id}/comments`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + token
        },
        body: JSON.stringify({ yorum })
      });

      if (res.ok) {
        document.getElementById('comment-input').value = '';
        loadComments();
      } else {
        alert('Yorum gönderilemedi');
      }
    });

    window.onload = loadVideo;
  </script>
</body>
</html>
