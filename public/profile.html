<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kullanıcı Profili</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <div class="container mt-5">
    <div class="text-center mb-3">
      <button id="follow-btn" class="btn btn-outline-primary d-none">Takip Et</button>
    </div>
    <h1 class="text-center mb-3" id="username">Kullanıcı</h1>
    <p class="text-center text-muted" id="bio">Profil açıklaması</p>
    <p class="text-center">
      <a href="#" id="followers-link" class="me-3">0 Takipçi</a>
      <a href="#" id="following-link">0 Takip</a>
    </p>
    <hr>
    <h4 class="mt-4 mb-3">Videolar</h4>
    <div class="row" id="user-videos"></div>
  </div>

  <!-- Takipçi / Takip edilen listesi için modal -->
  <div class="modal fade" id="followModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="followModalLabel">Takipçiler</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
        </div>
        <div class="modal-body">
          <ul id="follow-list" class="list-group"></ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadProfile() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) return;

      const [userRes, videosRes] = await Promise.all([
        fetch('/api/users/' + id),
        fetch('/api/videos?user_id=' + id)
      ]);

      if (!userRes.ok) return alert('Kullanıcı bulunamadı');
      const user = await userRes.json();
      document.getElementById('username').textContent = user.username || user.email;
      document.getElementById('bio').textContent = user.bio || '';

      const videos = await videosRes.json();
      const container = document.getElementById('user-videos');
      container.innerHTML = '';

      videos.forEach(video => {
        const col = document.createElement('div');
        col.className = 'col-md-4 mb-4';

        const card = document.createElement('div');
        card.className = 'card shadow';
        card.style.cursor = 'pointer';
        card.onclick = () => { window.location.href = 'video.html?id=' + video.id; };

        const thumb = document.createElement('img');
        thumb.src = '/thumbnails/' + (video.thumbnail_path || (video.filename + '.jpg'));
        thumb.className = 'card-img-top';
        thumb.onerror = () => thumb.src = 'https://via.placeholder.com/720x400?text=No+Thumbnail';

        const body = document.createElement('div');
        body.className = 'card-body';

        const title = document.createElement('h5');
        title.className = 'card-title';
        title.textContent = video.originalname;

        body.appendChild(title);
        card.appendChild(thumb);
        card.appendChild(body);
        col.appendChild(card);
        container.appendChild(col);
      });

      const token = localStorage.getItem('token');
      const followBtn = document.getElementById('follow-btn');
      if (!token) return;

      const currentUserRes = await fetch('/api/users/me', { headers: { Authorization: 'Bearer ' + token } });
      if (!currentUserRes.ok) return;

      const currentUser = await currentUserRes.json();
      console.log("Current user:", currentUser.id);
      console.log("Visiting profile of user:", id);
      if (parseInt(currentUser.id) === parseInt(id)) return;

      followBtn.classList.remove('d-none');

      const followRes = await fetch(`/api/users/${id}/follow`, {
        headers: { Authorization: 'Bearer ' + token }
      });
      if (!followRes.ok) {
        console.error('Takip durumu alınamadı:', await followRes.text());
        return;
      }
      const followData = await followRes.json();
      followBtn.textContent = followData.following ? 'Takibi Bırak' : 'Takip Et';

      followBtn.onclick = async () => {
        const method = followBtn.textContent === 'Takip Et' ? 'POST' : 'DELETE';
        const res = await fetch(`/api/users/${id}/follow`, {
          method,
          headers: { Authorization: 'Bearer ' + token }
        });
        if (res.ok) {
          followBtn.textContent = method === 'POST' ? 'Takibi Bırak' : 'Takip Et';
        }
      };

      const [followersRes, followingRes] = await Promise.all([
        fetch(`/api/users/${id}/followers`),
        fetch(`/api/users/${id}/following`)
      ]);

      if (followersRes.ok) {
        const followers = await followersRes.json();
        document.getElementById('followers-link').textContent = `${followers.length} Takipçi`;
      }
      if (followingRes.ok) {
        const following = await followingRes.json();
        document.getElementById('following-link').textContent = `${following.length} Takip`;
      }
    }

    loadProfile();

    document.getElementById('followers-link').addEventListener('click', async (e) => {
      e.preventDefault();
      await loadFollowList('followers');
    });

    document.getElementById('following-link').addEventListener('click', async (e) => {
      e.preventDefault();
      await loadFollowList('following');
    });

    async function loadFollowList(type) {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const res = await fetch(`/api/users/${id}/${type}`);
      const users = await res.json();

      document.getElementById('followModalLabel').textContent = type === 'followers' ? 'Takipçiler' : 'Takip Edilenler';
      const list = document.getElementById('follow-list');
      list.innerHTML = '';

      users.forEach(user => {
        const li = document.createElement('li');
        li.className = 'list-group-item';
        const a = document.createElement('a');
        a.href = `profile.html?id=${user.id}`;
        a.textContent = user.username || user.email;
        a.className = 'text-decoration-none';
        li.appendChild(a);
        list.appendChild(li);
      });

      new bootstrap.Modal(document.getElementById('followModal')).show();
    }
  </script>
</body>
</html>
