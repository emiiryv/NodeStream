

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kullanıcı Profili</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-3" id="username">Kullanıcı</h1>
    <p class="text-center text-muted" id="bio">Profil açıklaması</p>
    <hr>
    <h4 class="mt-4 mb-3">Videolar</h4>
    <div class="row" id="user-videos"></div>
  </div>

  <script>
    async function loadProfile() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) return;

      const [userRes, videosRes] = await Promise.all([
        fetch('/api/users/' + id),
        fetch('/api/videos?user_id=' + id)
      ]);

      if (!userRes.ok) return alert('Kullanıcı bulunamadı');
      const user = await userRes.json();
      document.getElementById('username').textContent = user.username || user.email;
      document.getElementById('bio').textContent = user.bio || '';

      const videos = await videosRes.json();
      const container = document.getElementById('user-videos');
      container.innerHTML = '';

      videos.forEach(video => {
        const col = document.createElement('div');
        col.className = 'col-md-4 mb-4';

        const card = document.createElement('div');
        card.className = 'card shadow';
        card.style.cursor = 'pointer';
        card.onclick = () => { window.location.href = 'video.html?id=' + video.id; };

        const thumb = document.createElement('img');
        thumb.src = '/thumbnails/' + (video.thumbnail_path || (video.filename + '.jpg'));
        thumb.className = 'card-img-top';
        thumb.onerror = () => thumb.src = 'https://via.placeholder.com/720x400?text=No+Thumbnail';

        const body = document.createElement('div');
        body.className = 'card-body';

        const title = document.createElement('h5');
        title.className = 'card-title';
        title.textContent = video.originalname;

        body.appendChild(title);
        card.appendChild(thumb);
        card.appendChild(body);
        col.appendChild(card);
        container.appendChild(col);
      });
    }

    loadProfile();
  </script>
</body>
</html>
